name: Language checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check editorial reference drift
        run: python3 scripts/sync-editorial-patterns.py --check
      - name: Check presentation catalogue drift
        run: python3 scripts/sync-skill-catalogue.py --check
      - name: Check bundled reference drift
        run: python3 scripts/sync-language-references.py --check
      - name: Validate terminology records
        run: |
          python3 scripts/check-language.py registry standards/terminology.json
          python3 scripts/check-language.py registry skills/establish-project-language/assets/terminology.example.json
      - name: Run deterministic checks
        run: python3 -m unittest discover -s tests -v
      - name: Fetch pinned Agent Skills validator
        uses: actions/checkout@v4
        with:
          repository: agentskills/agentskills
          ref: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          path: .validation/agentskills
      - name: Validate Geekist skills and report upstream compatibility
        run: |
          python3 -m pip install ./.validation/agentskills/skills-ref
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          catalogue = json.loads(Path("standards/skill-catalogue.json").read_text())
          upstream = {name for name, skill in catalogue["skills"].items() if skill.get("upstream")}
          failures = []
          for skill_path in sorted(Path("skills").glob("*/SKILL.md")):
              name = skill_path.parent.name
              result = subprocess.run(["skills-ref", "validate", str(skill_path.parent)], check=False)
              if result.returncode:
                  if name in upstream:
                      print(f"UPSTREAM COMPATIBILITY NOTICE: {name} is preserved as licensed source.")
                  else:
                      failures.append(name)
          if failures:
              print("Invalid Geekist-authored skills: " + ", ".join(failures), file=sys.stderr)
              sys.exit(1)
          PY
